workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      vars:
        XCODE_SCHEME: "Runner"
        XCODE_WORKSPACE: "Runner.xcworkspace"

    scripts:
      - name: Reset and Install Dependencies
        script: |
          flutter clean
          flutter pub get
          cd ios
          # مسح شامل لملفات التكوين القديمة
          rm -rf Pods Podfile.lock .symlinks DerivedData
          # تحديث المستودعات وتثبيت الـ Pods من جديد
          pod install --repo-update
          cd ..

      - name: Build iOS Simulator
        script: |
          flutter build ios --simulator --debug --no-codesign

    artifacts:
      # المسار الصحيح لملف التطبيق الخاص بالمحاكي
      - build/ios/iphonesimulator/*.app