workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      vars:
        XCODE_SCHEME: "Runner"
        XCODE_WORKSPACE: "Runner.xcworkspace"

    scripts:
      - name: Prepare Dependencies
        script: |
          # 1. تحميل حزم فلاتر وتحديثها لضمان توافق المكتبات
          flutter pub get
          flutter pub upgrade
          
          # 2. تنظيف ملفات iOS تماماً لضمان تطبيق تعديلات Podfile الجديدة
          cd ios
          rm -rf Pods Podfile.lock DerivedData
          
          # 3. تحديث المستودعات وتثبيت المكتبات
          pod install --repo-update
          cd ..

      - name: Build iOS Simulator App
        script: |
          # بناء نسخة المحاكي بدون توقيع إلكتروني
          flutter build ios --simulator --debug --no-codesign

    artifacts:
      # هذا هو المسار الصحيح والوحيد الذي تحتاجه لنسخة المحاكي
      - build/ios/iphonesimulator/*.app