workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      groups:
        - firebase_credentials # إذا كنت تستخدم مجموعات متغيرات بيئة
      vars:
        XCODE_SCHEME: "Runner"
        XCODE_WORKSPACE: "Runner.xcworkspace"

    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get
          # تحديث ملفات القفل لضمان التوافق مع Simulator
          flutter pub upgrade

      - name: Install CocoaPods and update Firebase
        script: |
          cd ios
          # تنظيف أي ملفات سابقة قد تسبب تعارضاً
          rm -rf Pods Podfile.lock
          # تثبيت الـ Pods مع تحديث المستودعات لضمان وجود FirebaseCore
          pod install --repo-update
          cd ..

      - name: Build iOS Simulator App
        script: |
          # تنظيف شامل قبل البناء
          flutter clean
          flutter pub get
          cd ios && rm -rf Pods Podfile.lock && pod install --repo-update && cd ..
          
          # البناء باستخدام أمر Flutter للمحاكي
          flutter build ios --simulator --debug --no-codesign



    artifacts:
      - Build/Products/Debug-iphonesimulator/*.app
      - build/ios/iphoneos/*.app
