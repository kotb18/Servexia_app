workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      vars:
        XCODE_SCHEME: "Runner"
        XCODE_WORKSPACE: "Runner.xcworkspace"

    scripts:
      - name: Flutter Clean
        script: |
          flutter clean

      - name: Get Packages
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks DerivedData
          pod install --repo-update
          cd ..

      - name: Build iOS Simulator
        script: |
          flutter build ios \
            --simulator \
            --debug \
            --no-codesign \
            --no-tree-shake-icons

      - name: Zip Simulator App
        script: |
          cd build/ios/iphonesimulator
          zip -r Runner.zip Runner.app

    artifacts:
      - build/ios/iphonesimulator/*.zip