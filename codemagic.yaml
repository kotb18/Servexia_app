workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Flutter Clean
        script: |
          flutter clean

      - name: Get Packages
        script: |
          flutter pub get

      # هذه الخطوة مهمة جداً لتجهيز مشروع iOS
      - name: Prepare iOS
        script: |
          flutter build ios --debug --no-codesign

      - name: Reinstall Pods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install
          cd ..

      - name: Build Simulator
        script: |
          xcodebuild \
          -workspace ios/Runner.xcworkspace \
          -scheme Runner \
          -sdk iphonesimulator \
          -configuration Debug \
          -derivedDataPath build

      - name: Zip App
        script: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r Runner.zip Runner.app

    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.zip