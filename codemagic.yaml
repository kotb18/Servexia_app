workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      vars:
        XCODE_SCHEME: "Runner"
        XCODE_WORKSPACE: "Runner.xcworkspace"

    scripts:
      - name: Install dependencies & Pods
        script: |
          # تنظيف وتحميل حزم فلاتر
          flutter clean
          flutter pub get
          flutter pub upgrade
          
          # إعداد CocoaPods للمحاكي
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Build iOS Simulator App
        script: |
          # البناء للمحاكي (بدون توقيع كود)
          flutter build ios --simulator --debug --no-codesign

    artifacts:
      # المسار الصحيح لملف التطبيق الخاص بالمحاكي
      - build/ios/iphonesimulator/*.app